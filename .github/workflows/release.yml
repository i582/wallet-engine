name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical release tag to build without publishing
        required: true
        type: string

permissions: { }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify:
    name: Verify release tag
    runs-on: ubicloud-standard-2-ubuntu-2204
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          version="$(cargo xtask dist verify-tag --tag "${RELEASE_TAG}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  native:
    name: Native ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubicloud-standard-8-ubuntu-2204
            target: x86_64-unknown-linux-gnu
          - runner: ubicloud-standard-8-arm-ubuntu-2204
            target: aarch64-unknown-linux-gnu
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
          save-if: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build native release package
        run: cargo xtask dist native --target "${{ matrix.target }}"

      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: target/distrib/*
          retention-days: 1
          if-no-files-found: error

  apple:
    name: Apple and Swift packages
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-apple
          save-if: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Apple Rust targets
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Build macOS native packages
        run: |
          cargo xtask dist native --target aarch64-apple-darwin
          cargo xtask dist native --target x86_64-apple-darwin

      - name: Build Swift package
        run: cargo xtask dist swift

      - name: Upload Apple packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apple
          path: target/distrib/*
          retention-days: 1
          if-no-files-found: error

  android:
    name: Android package
    needs: verify
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-android
          save-if: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-provider: basic

      - name: Build Android package
        run: cargo xtask dist android

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: target/distrib/*
          retention-days: 1
          if-no-files-found: error

  web:
    name: TypeScript and WebAssembly package
    needs: verify
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-web
          save-if: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install WebAssembly Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install wasm-pack
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build web package
        run: cargo xtask dist web

      - name: Upload web package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: target/distrib/*
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble GitHub Release
    needs:
      - verify
      - native
      - apple
      - android
      - web
    runs-on: ubicloud-standard-2-ubuntu-2204
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: target/distrib
          merge-multiple: true

      - name: Validate and describe release
        run: cargo xtask dist manifest

      - name: Upload complete dry-run output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-complete-${{ needs.verify.outputs.version }}
          path: target/distrib/*
          retention-days: 7
          if-no-files-found: error

      - name: Attest release packages
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            target/distrib/*.aar
            target/distrib/*.pom
            target/distrib/*.tar.gz
            target/distrib/*.tgz
            target/distrib/*.zip
            target/distrib/release-manifest.json

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          assets=(
            target/distrib/*.aar
            target/distrib/*.pom
            target/distrib/*.tar.gz
            target/distrib/*.tgz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/SHA256SUMS
            target/distrib/release-manifest.json
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
            gh release edit "${RELEASE_TAG}" \
              --title "Wallet Engine ${RELEASE_VERSION}" \
              --notes-file target/distrib/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Wallet Engine ${RELEASE_VERSION}" \
              --notes-file target/distrib/release-notes.md \
              "${prerelease[@]}" \
              "${assets[@]}"
          fi
