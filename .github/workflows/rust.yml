name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: { }

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, check, and clippy
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - name: Install quality tools
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: just@1.52.0,cargo-deny@0.19.8,cargo-shear@1.13.1
          fallback: none

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just clippy

      - name: Check all Rust targets
        run: just check-build

      - name: Check dependencies
        run: just deps-check

  tests:
    name: Tests
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 30
    env:
      WALLET_ENGINE_SCENARIO_TIMEOUT_SECS: "300"
      TON_CONNECT_BRIDGE_BIN: ${{ github.workspace }}/ton-connect-bridge/bridge3

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Check out TON Connect bridge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ton-connect/bridge
          ref: 97c750fa2cde50e389d623986e700fb0677e2484
          path: ton-connect-bridge
          persist-credentials: false

      - name: Build TON Connect bridge
        working-directory: ton-connect-bridge
        run: go build -o bridge3 ./cmd/bridge3

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/ton-connect/dapp/package-lock.json

      - name: Install TON Connect dApp dependencies
        working-directory: tests/ton-connect/dapp
        run: npm ci

      - name: Build TON Connect dApp
        working-directory: tests/ton-connect/dapp
        run: npm run build

      - name: Install test tools
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: just@1.52.0,nextest@0.9.137
          fallback: none

      - name: Install Acton trunk
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: trunk

      - name: Verify Acton
        run: acton --version

      - name: Run tests
        run: just test-rust

      - name: Check TUI example
        run: just tui-check
