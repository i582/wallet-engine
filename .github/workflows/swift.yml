name: Swift

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: { }

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  apple:
    name: Swift bindings and example
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TON_CONNECT_BRIDGE_BIN: ${{ github.workspace }}/ton-connect-bridge/bridge3

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-swift
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install iOS Simulator Rust target
        run: rustup target add aarch64-apple-ios-sim

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install just
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: just@1.52.0
          fallback: none

      - name: Check Swift bindings and example
        run: just swift-check

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Check out TON Connect bridge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ton-connect/bridge
          ref: 97c750fa2cde50e389d623986e700fb0677e2484
          path: ton-connect-bridge
          persist-credentials: false

      - name: Build TON Connect bridge
        working-directory: ton-connect-bridge
        run: go build -o bridge3 ./cmd/bridge3

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/ton-connect/dapp/package-lock.json

      - name: Install Acton trunk
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: trunk

      - name: Install iOS E2E dependencies
        run: just example-swift-e2e-install

      - name: Run iOS client scenarios
        run: just example-swift-e2e

      - name: Upload iOS E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-e2e-diagnostics
          path: target/swift-example-ios-e2e/Logs/Test
          if-no-files-found: ignore
