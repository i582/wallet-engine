[package]
name = "wallet-engine-v3"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
futures = "=0.3.31"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"
ton = { path = "vendor/ton", version = "=0.1.3", default-features = false }
uniffi = "=0.32.0"
url = "=2.5.7"
