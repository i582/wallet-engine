[package]
name = "wallet-engine"
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/ton-connect-client", "crates/ton-connect-core"]
default-members = [".", "crates/ton-connect-client", "crates/ton-connect-core"]
exclude = [
    "apple-bindgen",
    "examples/tui",
    "kotlin-bindgen",
    "verification/kani",
    "vendor/ton",
    "wasm-bindings",
    "xtask",
]
resolver = "3"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
doctest = false

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
futures = "=0.3.31"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
num-bigint = "=0.4.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"
ton = { path = "vendor/ton", version = "=0.1.3", default-features = false }
ton-connect-client = { path = "crates/ton-connect-client", version = "=0.1.0" }
ton-connect-core = { path = "crates/ton-connect-core", version = "=0.1.0" }
uniffi = "=0.32.0"
url = "=2.5.7"
zeroize = "=1.9.0"

[dev-dependencies]
proptest = "=1.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
similar = { version = "=2.7.0", features = ["inline"] }
tempfile = "=3.27.0"
ton_core = "=0.1.4"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_results = "deny"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
exit = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"

elidable_lifetime_names = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_raw_string_hashes = "warn"
format_push_string = "warn"
doc_markdown = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
trivially_copy_pass_by_ref = "warn"
match_wildcard_for_single_variants = "warn"
match_same_arms = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
assigning_clones = "warn"
ref_option = "warn"
wildcard_imports = "warn"

option_option = "allow"
use_self = "allow"
redundant_pub_crate = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
option_if_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
cognitive_complexity = "allow"
items_after_statements = "allow"
missing_panics_doc = "allow"
fallible_impl_from = "allow"
unreadable_literal = "allow"
similar_names = "allow"
implicit_hasher = "allow"
struct_field_names = "allow"
literal_string_with_formatting_args = "allow"
ignored_unit_patterns = "allow"
significant_drop_tightening = "allow"
