[package]
name = "wallet-engine-wasm"
version = "0.0.4"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "=0.1.89"
js-sys = "=0.3.104"
send_wrapper = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
wallet-engine = { path = "../.." }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--all-features",
]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
