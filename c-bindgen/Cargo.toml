[package]
name = "wallet-engine-c-bindgen"
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
camino = { version = "=1.2.5", features = ["serde1"] }
clap = { version = "=4.6.6", features = ["derive"] }
heck = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uniffi_bindgen = { version = "=0.32.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

expect_used = "deny"
redundant_pub_crate = "allow"
unwrap_used = "deny"
