language = "C"
cpp_compat = true
include_guard = "WALLET_ENGINE_H"
include_version = true
autogen_warning = "/* Generated by `cargo xtask bindings c`. Do not edit. */"
documentation = true
documentation_style = "c"
line_endings = "LF"
style = "both"
usize_is_size_t = true

after_includes = """
#if defined(_WIN32)
#  if defined(WALLET_ENGINE_BUILD)
#    define WALLET_ENGINE_API __declspec(dllexport)
#  else
#    define WALLET_ENGINE_API __declspec(dllimport)
#  endif
#elif defined(__GNUC__)
#  define WALLET_ENGINE_API __attribute__((visibility(\"default\")))
#else
#  define WALLET_ENGINE_API
#endif
"""

[export]
include = [
    "ABI_VERSION",
    "WalletEngineAbiStatus",
    "WalletEngineStringView",
    "WalletEngineBytesView",
    "WalletEngineNetwork",
    "WALLET_ENGINE_NETWORK_MAINNET",
    "WALLET_ENGINE_NETWORK_TESTNET",
    "WalletEngineCreateWalletRequest",
    "WalletEngineProtectedSecretRefView",
    "WalletEngineProtectedSecretStoreView",
    "WalletEngineWalletDescriptorView",
    "WalletEngineStringViewSlice",
    "WalletEngineRecoveryPhraseView",
    "WalletEngineCreatedWalletView",
    "WalletEngineProtectedSecretHostErrorKind",
    "WalletEngineProtectedSecretHostErrorView",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_NOT_FOUND",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_AUTHENTICATION_FAILED",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_CANCELLED",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_UNAVAILABLE",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_POLICY_VIOLATION",
    "WALLET_ENGINE_PROTECTED_SECRET_HOST_ERROR_KIND_OTHER",
    "WalletEngineWalletLifecycleErrorCode",
    "WalletEngineWalletLifecycleErrorView",
    "WalletEngineCompletionId",
    "WalletEngineContextRetainFn",
    "WalletEngineContextReleaseFn",
    "WalletEngineStoreProtectedSecretFn",
    "WalletEnginePlatformHostCallbacks",
    "WalletEngineLifecycle",
    "WalletEngineCreateWalletCompletionFn",
    "wallet_engine_lifecycle_new",
    "wallet_engine_lifecycle_free",
    "wallet_engine_lifecycle_create_wallet",
    "wallet_engine_store_protected_secret_complete",
    "wallet_engine_abi_version",
]

[export.rename]
"ABI_VERSION" = "WALLET_ENGINE_ABI_VERSION"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
prefix = "WALLET_ENGINE_API"
