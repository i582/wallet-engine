[package]
name = "ton-connect-client"
version.workspace = true
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
description = "Runtime-neutral wallet-side TON Connect session client"
readme = "README.md"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"
ton-connect-core = { path = "../ton-connect-core" }
url = "=2.5.7"

[dev-dependencies]
base64 = "=0.22.1"
ton_core = "=0.1.4"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_results = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[lib]
test = false
doctest = false
