[package]
name = "wallet-engine-tui-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.102"
arboard = { version = "=3.6.1", default-features = false }
async-trait = "=0.1.89"
crossterm = "=0.29.0"
futures-util = "=0.3.31"
num-bigint = "=0.4.8"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "=0.7.18"
ton-connect-client = { path = "../../crates/ton-connect-client" }
ton-connect-core = { path = "../../crates/ton-connect-core" }
url = "=2.5.7"
wallet-engine = { path = "../.." }

[lints.clippy]
expect_used = "deny"
