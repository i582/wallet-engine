[package]
name = "wallet-engine-xtask"
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
cbindgen = "=0.29.4"
clap = { version = "=4.6.6", features = ["derive"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
toml_edit = "=0.25.13"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "allow"
